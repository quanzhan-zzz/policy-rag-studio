services:
  mock-llm:
    image: python:3.12-slim
    command: ["python", "/app/tests/mock_llm_server.py"]
    volumes:
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 2s
      retries: 10

  api:
    environment:
      LLM_API_BASE: http://mock-llm:8000/v1
      LLM_API_KEY: test
      LLM_MODEL: mock-glm
      RERANKER_PROVIDER: heuristic
    depends_on:
      mock-llm:
        condition: service_healthy

  worker:
    environment:
      LLM_API_BASE: http://mock-llm:8000/v1
      LLM_API_KEY: test
      LLM_MODEL: mock-glm
