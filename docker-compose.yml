services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: policyrag
      POSTGRES_USER: policyrag
      POSTGRES_PASSWORD: policyrag
    ports:
      - "5432:5432"
    volumes:
      - policyrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyrag -d policyrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql+asyncpg://policyrag:policyrag@db:5432/policyrag
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://policyrag:policyrag@db:5432/policyrag
      REDIS_URL: redis://redis:6379/0
      INDEX_TASK_STALE_SECONDS: ${INDEX_TASK_STALE_SECONDS:-300}
    command:
      [
        "uv",
        "run",
        "--no-dev",
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
      ]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://policyrag:policyrag@db:5432/policyrag
      REDIS_URL: redis://redis:6379/0
      INDEX_TASK_STALE_SECONDS: ${INDEX_TASK_STALE_SECONDS:-300}
    command:
      [
        "uv",
        "run",
        "--no-dev",
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  policyrag_pgdata:
