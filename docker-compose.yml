services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: policyrag
      POSTGRES_USER: policyrag
      POSTGRES_PASSWORD: policyrag
    ports:
      - "5432:5432"
    volumes:
      - policyrag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyrag -d policyrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      API_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql+asyncpg://policyrag:policyrag@db:5432/policyrag
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  policyrag_pgdata:
